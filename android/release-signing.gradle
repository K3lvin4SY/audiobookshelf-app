// Signs release builds when a keystore is provided through environment variables, as the
// "Release Wear OS App" workflow does. Without them, release builds stay unsigned exactly as before.
//
// The phone and watch apps must be signed with the same key for the Wear OS Data Layer to connect
// them, so both modules apply this file.
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
if (keystorePath) {
  android {
    signingConfigs {
      release {
        storeFile file(keystorePath)
        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
        keyAlias System.getenv("ANDROID_KEY_ALIAS")
        keyPassword System.getenv("ANDROID_KEY_PASSWORD")
      }
    }
    buildTypes.release.signingConfig signingConfigs.release
  }
}
