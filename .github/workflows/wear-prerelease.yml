name: Wear OS pre-release

# Run by hand from the Actions tab. Builds the phone app and the Wear OS app from any branch,
# signs both with the same key (needed for the phone and watch to talk to each other) and
# publishes them as a GitHub pre-release.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        required: true
        default: wear-app
      tag:
        description: Release tag (leave empty for wear-<date>-<commit>)
        required: false

permissions:
  contents: write

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Build Nuxt project
        run: npm run generate

      - name: Copy to Android project
        run: npx cap sync android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed phone and watch APKs
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Injected signing properties sign the release build without changing build.gradle
        run: |
          ./gradlew :app:assembleRelease :wear:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Check both APKs have the same signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          phone="$("$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep 'SHA-256')"
          watch="$("$apksigner" verify --print-certs android/wear/build/outputs/apk/release/wear-release.apk | grep 'SHA-256')"
          echo "Phone: $phone"
          echo "Watch: $watch"
          [ -n "$phone" ] && [ "$phone" = "$watch" ]

      - name: Name the release
        run: |
          sha="$(git rev-parse --short HEAD)"
          tag="${{ inputs.tag }}"
          [ -z "$tag" ] && tag="wear-$(date -u +%Y%m%d-%H%M%S)-$sha"
          mkdir out
          cp android/app/build/outputs/apk/release/app-release.apk "out/audiobookshelf-phone-$tag.apk"
          cp android/wear/build/outputs/apk/release/wear-release.apk "out/audiobookshelf-wear-$tag.apk"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --prerelease \
            --title "Wear OS $TAG" \
            --notes "Built from \`${{ inputs.ref }}\` at $SHA. Install the phone APK on the phone and the wear APK on the watch; both are signed with the same key so they can connect."

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
