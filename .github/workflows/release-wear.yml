name: Release Wear OS App

# Builds the Wear OS app together with a matching phone app, both signed with the same release key
# (required for the watch and phone to talk to each other), and publishes them as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.14.2-wear.1 (the tag will be wear-v<version>)'
        required: true
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check inputs and signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Version may only contain letters, digits, '.', '-' and '+'"
            exit 1
          fi
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name"
              missing=1
            fi
          done
          exit $missing

      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Build Nuxt project
        run: npm run generate

      - name: Copy to Android project
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed phone and watch apps
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          # Every release gets a higher version code so it installs as an update on the watch
          export WEAR_VERSION_CODE=$((10000200 + GITHUB_RUN_NUMBER))
          export WEAR_VERSION_NAME="$VERSION"
          ./android/gradlew -p android :app:assembleRelease :wear:assembleRelease --no-daemon

      - name: Collect APKs
        run: |
          mkdir release-apks
          cp android/app/build/outputs/apk/release/app-release.apk "release-apks/audiobookshelf-phone-$VERSION.apk"
          cp android/wear/build/outputs/apk/release/wear-release.apk "release-apks/audiobookshelf-wear-$VERSION.apk"
          ls -l release-apks

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          cat > notes.md <<'EOF'
          Audiobookshelf for Wear OS, with a matching phone app.

          Both APKs are signed with the same key. Install **both** from this release so the watch and phone can share settings.
          If the Play Store version of the phone app is installed, uninstall it first (Android won't replace an app signed with a different key).

          **Phone:** open `audiobookshelf-phone-*.apk` on the phone and install it.

          **Watch:** enable Wireless debugging on the watch (Settings → Developer options), then:
          ```
          adb pair <watch-ip>:<pairing-port>
          adb connect <watch-ip>:<port>
          adb install -r audiobookshelf-wear-*.apk
          ```
          EOF
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "wear-v$VERSION" release-apks/*.apk \
            --target "$GITHUB_SHA" \
            --title "Audiobookshelf Wear OS $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
